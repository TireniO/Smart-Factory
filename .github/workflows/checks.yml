name: Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint and format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        uses: astral-sh/ruff-action@v3
        with:
          args: "check"
      - name: Format
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check --diff"

  files:
    name: Large files and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block files over 5 MB
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +5M -print)
          if [ -n "$big" ]; then
            echo "::error::These files are over 5 MB. Store them on the shared drive instead:"
            echo "$big"
            exit 1
          fi
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pr-format:
    name: PR title and linked issue
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title and description
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          TITLE="$(echo "$TITLE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          ok=true
          if ! echo "$TITLE" | grep -Eq '^\[(T([1-9]|1[0-5])|PM)\] (feat|fix|data|docs|refactor|chore): .+'; then
            echo "::error::PR title must look like: [T1] feat: add K2 Plus logger"
            ok=false
          fi
          if ! echo "$BODY" | grep -Eiq '(closes|fixes|resolves) #[0-9]+'; then
            echo "::error::Add 'Closes #<issue number>' to the PR description"
            ok=false
          fi
          $ok
